<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Convite — Bunny</title>
<style>
:root{--bg:#080808;--surface:#171717;--line:rgba(255,255,255,.14);--text:#f2f2f2;--text-2:rgba(255,255,255,.72);--teal:#54b9a6;--danger:#e0786f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.6 Inter,system-ui,sans-serif;padding:24px 16px}
main{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
h1{font-size:26px;line-height:1.2;margin:0 0 12px;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--text-2)}
strong{color:var(--text)}
.mail{display:block;margin:0 0 16px;padding:12px 14px;border:1px solid var(--teal);border-radius:12px;color:var(--text);word-break:break-all}
label{display:block;font-size:14px;margin:14px 0 6px;color:var(--text-2)}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e0e0e;color:var(--text);font:inherit}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{margin-top:18px;width:100%;padding:13px;border-radius:999px;border:0;background:var(--teal);color:#06130f;font:600 16px inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--danger);margin-top:12px;min-height:1.4em;font-size:15px}
a{color:var(--teal)}
details{margin-top:18px}
summary{cursor:pointer;color:var(--text-2)}
[hidden]{display:none!important}
.last{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:15px}
</style>
</head>
<body>
<main id="app" aria-live="polite"><h1>Um instante…</h1></main>
<script src="/convite.js"></script>
</body>
</html>
